name: validate-39951-fork-source

on:
  pull_request:
    branches:
      - validation/base-39951-focal
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  focal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/39951-session-start-fork-source
          persist-credentials: true

      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103

      - name: Update SessionStart source schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('codex-rs/hooks/src/schema.rs')
          text = path.read_text()
          old = 'string_enum_schema(&["startup", "resume", "clear", "compact"])'
          new = 'string_enum_schema(&["startup", "resume", "fork", "clear", "compact"])'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one SessionStart source enum, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          just write-hooks-schema
          cargo fmt --manifest-path codex-rs/Cargo.toml --all
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "codex-rs/hooks/schema/generated/session-start.command.input.schema.json"
            "codex-rs/hooks/src/schema.rs"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Commit schema update locally
        shell: bash
        run: |
          git config user.name "Carlos Acosta"
          git config user.email "93443910+charle-z@users.noreply.github.com"
          git add codex-rs/hooks/src/schema.rs codex-rs/hooks/schema/generated/session-start.command.input.schema.json
          git commit -m "feat(hooks): expose fork session start source in schema"

      - name: Test hooks crate
        working-directory: codex-rs
        run: just test -p codex-hooks

      - name: Lint-fix hooks crate
        working-directory: codex-rs
        run: just fix -p codex-hooks

      - name: Recheck fork history mapping
        working-directory: codex-rs
        run: just test -p codex-core forked_initial_history_uses_fork_session_start_source

      - name: Lint-fix core crate
        working-directory: codex-rs
        run: just fix -p codex-core

      - name: Verify formatter and clean tree
        shell: bash
        run: |
          cargo fmt --manifest-path codex-rs/Cargo.toml --all -- --check
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish validated schema commit
        shell: bash
        run: git push origin HEAD:fix/39951-session-start-fork-source
