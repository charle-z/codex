name: validate-external-agent-migration-40147-v13

on:
  push:
    branches:
      - validation/run-40147-v13

permissions:
  contents: write

jobs:
  migration:
    if: ${{ !startsWith(github.event.head_commit.message, 'validation-result:') && !startsWith(github.event.head_commit.message, 'validation-diagnostic:') }}
    runs-on: ubuntu-22.04
    outputs:
      shape: ${{ steps.shape.outcome }}
      matrix: ${{ steps.matrix.outcome }}
      crate: ${{ steps.crate.outcome }}
      fix: ${{ steps.fix.outcome }}
      clippy: ${{ steps.clippy.outcome }}
      fmt: ${{ steps.fmt.outcome }}
      clean: ${{ steps.clean.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/40147-preserve-external-agent-references-v13
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Assert exact source shape
        id: shape
        continue-on-error: true
        run: |
          test "$(git rev-parse HEAD)" = "3d4c548c32de664894184575e8b7e89a160169eb"
          test "$(git rev-parse HEAD^)" = "694edc23b22b4696400dc47663ecacd437623870"
          test "$(git rev-list --count 694edc23b22b4696400dc47663ecacd437623870..HEAD)" -eq 1
          files="$(git diff --name-only 694edc23b22b4696400dc47663ecacd437623870...HEAD | sort)"
          expected=$'codex-rs/external-agent-migration/src/rewrite.rs\ncodex-rs/external-agent-migration/src/rewrite_tests.rs'
          test "$files" = "$expected"
      - name: Compile and run adversarial matrix
        id: matrix
        continue-on-error: true
        run: |
          cat > /tmp/rewrite_40147_matrix.rs <<'RS'
          mod rewrite {
              include!(concat!(env!("GITHUB_WORKSPACE"), "/codex-rs/external-agent-migration/src/rewrite.rs"));
          }
          use rewrite::RewriteProfile;
          const CLAUDE: RewriteProfile = RewriteProfile::new(
              "CLAUDE.md",
              &["claude code", "claude-code", "claude_code", "claudecode", "claude"],
          );
          fn main() {
              let cases = [
                  ("~/.claude/projects/", "~/.claude/projects/"),
                  (r"C:\Users\x\.claude\plans", r"C:\Users\x\.claude\plans"),
                  ("https://example/?agent=claude#claude", "https://example/?agent=claude#claude"),
                  ("claude:session", "claude:session"),
                  ("?agent=claude", "?agent=claude"),
                  ("[docs](claude)", "[docs](claude)"),
                  (r"[docs](foo\)claude)", r"[docs](foo\)claude)"),
                  ("[docs]: claude", "[docs]: claude"),
                  ("[docs]: <claude>", "[docs]: <claude>"),
                  ("[Claude](https://example.test/)", "[Codex](https://example.test/)"),
                  ("Claude Code UI", "Codex UI"),
                  ("Read CLAUDE.md.", "Read AGENTS.md."),
              ];
              for (input, expected) in cases {
                  assert_eq!(CLAUDE.rewrite(input), expected, "input={input}");
              }
          }
          RS
          rustc --edition=2024 /tmp/rewrite_40147_matrix.rs -o /tmp/rewrite_40147_matrix
          /tmp/rewrite_40147_matrix
      - name: Test external-agent migration crate
        id: crate
        continue-on-error: true
        run: just test -p codex-external-agent-migration
      - name: Apply scoped clippy fixes
        id: fix
        continue-on-error: true
        run: just fix -p codex-external-agent-migration
      - name: Run scoped clippy
        id: clippy
        continue-on-error: true
        run: just clippy -p codex-external-agent-migration -- -D warnings
      - name: Check Rust formatting
        id: fmt
        continue-on-error: true
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Verify validation did not change tracked files
        id: clean
        continue-on-error: true
        run: git diff --exit-code

  report:
    if: ${{ always() && !startsWith(github.event.head_commit.message, 'validation-result:') && !startsWith(github.event.head_commit.message, 'validation-diagnostic:') }}
    needs: migration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/run-40147-v13
          fetch-depth: 1
          persist-credentials: true
      - name: Publish diagnostic result
        env:
          SHAPE: ${{ needs.migration.outputs.shape }}
          MATRIX: ${{ needs.migration.outputs.matrix }}
          CRATE: ${{ needs.migration.outputs.crate }}
          FIX: ${{ needs.migration.outputs.fix }}
          CLIPPY: ${{ needs.migration.outputs.clippy }}
          FMT: ${{ needs.migration.outputs.fmt }}
          CLEAN: ${{ needs.migration.outputs.clean }}
        run: |
          mkdir -p .validation
          printf 'candidate=3d4c548c32de664894184575e8b7e89a160169eb\nbase=694edc23b22b4696400dc47663ecacd437623870\nshape=%s\nmatrix=%s\ncrate=%s\nfix=%s\nclippy=%s\nfmt=%s\nclean=%s\n' "$SHAPE" "$MATRIX" "$CRATE" "$FIX" "$CLIPPY" "$FMT" "$CLEAN" > .validation/40147-v13-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation/40147-v13-diagnostic.txt
          git commit -m "validation-diagnostic: 40147 v13"
          git push origin HEAD:validation/run-40147-v13
