name: validate-external-agent-migration-40147-v13

on:
  push:
    branches:
      - validation/run-40147-v13

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !startsWith(github.event.head_commit.message, 'rustfmt-result:') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/40147-preserve-external-agent-references-v13
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Apply repository rustfmt
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item
      - name: Capture exact rustfmt diff
        run: |
          git diff -- codex-rs/external-agent-migration/src/rewrite.rs codex-rs/external-agent-migration/src/rewrite_tests.rs > /tmp/40147-v13-rustfmt.diff
          test -s /tmp/40147-v13-rustfmt.diff
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/run-40147-v13
          fetch-depth: 1
          persist-credentials: true
      - name: Publish rustfmt diff
        run: |
          mkdir -p .validation
          cp /tmp/40147-v13-rustfmt.diff .validation/40147-v13-rustfmt.diff
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation/40147-v13-rustfmt.diff
          git commit -m "rustfmt-result: 40147 v13"
          git push origin HEAD:validation/run-40147-v13
