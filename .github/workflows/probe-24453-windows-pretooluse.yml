name: probe-24453-windows-pretooluse

on:
  push:
    branches:
      - probe/24453-windows-pretooluse-v1

jobs:
  windows-pretooluse:
    name: Windows PreToolUse exec probe
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run focused Windows PreToolUse exec probe
        shell: pwsh
        run: |
          cargo test -p codex-core --test all suite::hooks_windows::pre_tool_use_json_deny_blocks_exec_command_before_execution_on_windows -- --exact --nocapture
