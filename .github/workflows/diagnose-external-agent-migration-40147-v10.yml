name: diagnose-external-agent-migration-40147-v10

on:
  push:
    branches:
      - validation/diag-40147-v10

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !startsWith(github.event.head_commit.message, 'validation-diagnostic:') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/40147-preserve-external-agent-references-v10
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Assert exact source shape
        id: shape
        continue-on-error: true
        run: |
          test "$(git rev-parse HEAD)" = "38c06e544374dbc186c724d9783364cf9dd47256"
          test "$(git rev-list --count 89650c66f2a817378f0935325dbb062d25fb0202..HEAD)" -eq 1
          test -z "$(git rev-list HEAD..89650c66f2a817378f0935325dbb062d25fb0202)"
          files="$(git diff --name-only 89650c66f2a817378f0935325dbb062d25fb0202...HEAD | sort)"
          expected=$'codex-rs/external-agent-migration/src/rewrite.rs\ncodex-rs/external-agent-migration/src/rewrite_tests.rs'
          test "$files" = "$expected"
      - name: Test external-agent migration crate
        id: crate
        continue-on-error: true
        run: just test -p codex-external-agent-migration
      - name: Check Rust formatting before fix
        id: fmt_before
        continue-on-error: true
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Apply scoped clippy fixes
        id: fix
        continue-on-error: true
        run: just fix -p codex-external-agent-migration
      - name: Run scoped clippy
        id: clippy
        continue-on-error: true
        run: just clippy -p codex-external-agent-migration -- -D warnings
      - name: Check Rust formatting after fix
        id: fmt_after
        continue-on-error: true
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Verify validation did not change tracked files
        id: clean
        continue-on-error: true
        run: git diff --exit-code
      - name: Checkout diagnostic branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: validation/diag-40147-v10
          fetch-depth: 1
          persist-credentials: true
      - name: Publish diagnostic marker
        env:
          SHAPE: ${{ steps.shape.outcome }}
          CRATE: ${{ steps.crate.outcome }}
          FMT_BEFORE: ${{ steps.fmt_before.outcome }}
          FIX: ${{ steps.fix.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          FMT_AFTER: ${{ steps.fmt_after.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          mkdir -p .validation
          printf 'candidate=38c06e544374dbc186c724d9783364cf9dd47256\nbase=89650c66f2a817378f0935325dbb062d25fb0202\nshape=%s\ncrate=%s\nfmt_before=%s\nfix=%s\nclippy=%s\nfmt_after=%s\nclean=%s\n' "$SHAPE" "$CRATE" "$FMT_BEFORE" "$FIX" "$CLIPPY" "$FMT_AFTER" "$CLEAN" > .validation/40147-v10-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation/40147-v10-diagnostic.txt
          git commit -m "validation-diagnostic: 40147 v10"
          git push origin HEAD:validation/diag-40147-v10
